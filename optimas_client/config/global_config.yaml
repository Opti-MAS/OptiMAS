# OptiMAS Client Configuration
# All paths are relative to the project root

# MCP configuration (global, shared by all agents)
mcp:
  server_url: "http://127.0.0.1:8188/mcp"
  api_key: "optimas-local-dev-key"

# Messaging configuration (global)
messaging:
  handlers:
    - type: "console"
      use_colors: true

# API usage recording configuration (global)
api_usage_recording:
  enabled: true
  storage_path: "API_USAGE_STORAGE"  # Relative or absolute path; defaults to logs/api_usage under project root

# LLM global settings (applied to all LLMs)
llm_settings:
  read_timeout: 600.0
per_problem_timeout: 600.0

# Skill directory configuration (global, shared by all agents)
workspace_base_dir: "./workspace"